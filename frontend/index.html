
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G10 Finanças</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #174c38;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            background: #174c38;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #23694e;
        }

        #resultado {
            margin-top: 20px;
            padding: 12px;
            background: #edf7f0;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>G10 Finanças</h1>
    <h2>Cadastro de movimentações</h2>

    <form id="formMovimentacao">

        <label for="tipo">Tipo de movimentação</label>
        <select id="tipo" required>
            <option value="">Selecione</option>
            <option value="Receita">Receita</option>
            <option value="Despesa">Despesa</option>
        </select>

        <label for="descricao">Descrição</label>
        <input type="text" id="descricao"
               placeholder="Ex.: Venda de produtos" required>

        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor"
               min="0.01" step="0.01" required>

        <label for="data">Data</label>
        <input type="date" id="data" required>

        <label for="categoria">Categoria</label>
        <select id="categoria" required>
            <option value="">Selecione</option>
            <option value="Vendas">Vendas</option>
            <option value="Serviços">Serviços</option>
            <option value="Alimentação">Alimentação</option>
            <option value="Transporte">Transporte</option>
            <option value="Outros">Outros</option>
        </select>

        <button type="submit">Cadastrar movimentação</button>
    </form>

    <div id="resultado" aria-live="polite">
        Nenhuma movimentação cadastrada.
    </div>
</div>

<script>
    const formulario = document.getElementById("formMovimentacao");
    const resultado = document.getElementById("resultado");

    formulario.addEventListener("submit", function(event) {
        event.preventDefault();

        if (!formulario.reportValidity()) return;

        const tipo = document.getElementById("tipo").value;
        const descricao = document.getElementById("descricao").value.trim();
        const valor = Number(document.getElementById("valor").value);
        const data = document.getElementById("data").value;
        const categoria = document.getElementById("categoria").value;

        if (!descricao || !Number.isFinite(valor) || valor <= 0) {
            resultado.textContent = "Informe uma descrição e um valor válido.";
            return;
        }

        resultado.textContent =
            tipo + " cadastrada: " + descricao +
            " | R$ " + valor.toFixed(2) +
            " | " + data +
            " | " + categoria;

        formulario.reset();
    });
</script>

</body>
</html>
